<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#FAF7FF}
      .title{font-size:84px;font-weight:800;letter-spacing:-2px}
      .tag{font-size:28px;font-weight:600;opacity:0;animation:cycle 9s infinite}
      .tag.b{animation-delay:3s}.tag.c{animation-delay:6s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-8px)}}
      .bear{animation:bob 3.2s ease-in-out infinite;transform-origin:950px 170px}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
      .eye{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
      @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(0.1)}}
      .spark{fill:#FFFFFF;animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .s2{animation-delay:.6s}.s3{animation-delay:1.2s}.s4{animation-delay:1.8s}.s5{animation-delay:.9s}
      @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.95;transform:scale(1.1)}}
      .wave{animation:wave 1.6s ease-in-out infinite;transform-origin:1048px 222px}
      @keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="950" cy="170" r="170" fill="url(#glow)"/>

  <path class="spark" d="M120 60 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  <path class="spark s2" d="M700 50 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  <path class="spark s3" d="M1120 70 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  <path class="spark s4" d="M790 270 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
  <path class="spark s5" d="M560 280 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>

  <text class="t title" x="80" y="160">alivey</text>
  <text class="t tag" x="84" y="215">Bring your plushie to life.</text>
  <text class="t tag b" x="84" y="215">Snap a photo. Get a 3D companion.</text>
  <text class="t tag c" x="84" y="215">Talk to it. It remembers you.</text>

  <g class="bear">
    <circle cx="880" cy="78" r="34" fill="#F3E8D8"/><circle cx="880" cy="78" r="17" fill="#E7CFB3"/>
    <circle cx="1020" cy="78" r="34" fill="#F3E8D8"/><circle cx="1020" cy="78" r="17" fill="#E7CFB3"/>
    <ellipse cx="950" cy="250" rx="78" ry="62" fill="#F3E8D8"/>
    <ellipse cx="950" cy="258" rx="44" ry="36" fill="#FFF7EE"/>
    <ellipse class="wave" cx="1048" cy="210" rx="22" ry="34" fill="#F3E8D8" transform="rotate(-30 1048 210)"/>
    <ellipse cx="856" cy="240" rx="22" ry="32" fill="#F3E8D8" transform="rotate(25 856 240)"/>
    <circle cx="950" cy="140" r="88" fill="#F3E8D8"/>
    <ellipse cx="950" cy="170" rx="38" ry="30" fill="#FFF7EE"/>
    <ellipse class="eye" cx="918" cy="128" rx="9" ry="11" fill="#2B2438"/>
    <ellipse class="eye" cx="982" cy="128" rx="9" ry="11" fill="#2B2438"/>
    <ellipse cx="950" cy="160" rx="12" ry="8" fill="#2B2438"/>
    <path d="M940 178 q10 10 20 0" stroke="#2B2438" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="900" cy="162" r="10" fill="#EC4899" opacity=".35"/>
    <circle cx="1000" cy="162" r="10" fill="#EC4899" opacity=".35"/>
  </g>
</svg>
