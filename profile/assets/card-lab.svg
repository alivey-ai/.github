<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .dot{animation:p 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
    .bar{animation:g 3s ease-in-out infinite alternate}
    @keyframes g{from{width:60px}to{width:140px}}
  </style>
  <rect x="1" y="1" width="398" height="188" rx="18" fill="#FAF7FF" stroke="#C7B4EB" stroke-width="2"/>
  <rect class="bar" x="24" y="24" height="6" rx="3" width="60" fill="#EC4899"/>
  <text class="t" x="24" y="72" font-size="26" font-weight="800" fill="#2B2438">The Lab</text>
  <text class="t" x="24" y="104" font-size="15" fill="#6E6580">Small web games we build fast:</text>
  <text class="t" x="24" y="126" font-size="15" fill="#6E6580">Plush Island, Adopt Robo and more.</text>
  <circle class="dot" cx="31" cy="160" r="5" fill="#EC4899"/>
  <text class="t" x="44" y="165" font-size="14" font-weight="700" fill="#EC4899">IN DEVELOPMENT</text>
</svg>
